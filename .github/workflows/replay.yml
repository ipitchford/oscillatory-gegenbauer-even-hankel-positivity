# SPDX-License-Identifier: MIT
name: Replay
on:
  push:
  pull_request:
jobs:
  quick:
    name: verify.py with and without -O (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check MANIFEST.sha256
        run: sha256sum -c MANIFEST.sha256
      - name: Install pinned packages
        run: python -m pip install -r requirements.txt
      - name: verify.py with and without -O (explicit checks, no assert)
        run: |
          python -I -B -O verify.py --output "$RUNNER_TEMP/out_O.json"
          python -I -B verify.py --output "$RUNNER_TEMP/out.json"
      - name: Compare with the shipped verification_results.json (elapsed_seconds ignored)
        run: |
          python -I -B - "$RUNNER_TEMP/out_O.json" "$RUNNER_TEMP/out.json" verification_results.json <<'EOF'
          import json, sys
          strip = lambda d: {k: v for k, v in d.items() if k != "elapsed_seconds"}
          ref = strip(json.load(open(sys.argv[3])))
          for p in sys.argv[1:3]:
              new = json.load(open(p))
              if new["status"] != "all checks passed" or strip(new) != ref:
                  sys.exit(f"mismatch: {p}")
          print("identical apart from elapsed_seconds")
          EOF
      - name: Working tree unchanged
        run: test -z "$(git status --porcelain)"
